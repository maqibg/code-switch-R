version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

vars:
  APP_NAME: "code-switch-R"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the Windows amd64 portable application
    cmds:
      - task: windows:build
        vars:
          ARCH: amd64

  package:
    summary: Builds the Windows amd64 portable release binary
    cmds:
      - task: windows:package
        vars:
          ARCH: amd64

  run:
    summary: Runs the application
    cmds:
      - task: windows:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

