name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-portable:
    name: Build Windows amd64 portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $source = Get-Content version_service.go -Raw -Encoding utf8
          $source = $source -replace 'const AppVersion = "v[^"]*"', "const AppVersion = `"v$version`""
          Set-Content version_service.go $source -Encoding utf8

          $info = Get-Content build/windows/info.json -Raw -Encoding utf8 | ConvertFrom-Json
          $info.fixed.file_version = $version
          $info.info.'0000'.ProductVersion = $version
          $info | ConvertTo-Json -Depth 10 | Set-Content build/windows/info.json -Encoding utf8

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.88

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate build assets and bindings
        shell: pwsh
        run: |
          wails3 task common:update:build-assets
          wails3 task common:generate:bindings

      - name: Run Go tests
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go test ./... -timeout 120s

      - name: Build portable binary
        shell: pwsh
        env:
          PRODUCTION: 'true'
        run: |
          $env:ARCH = 'amd64'
          wails3 task windows:build
          if (-not (Test-Path 'bin/code-switch-R.exe')) {
            throw 'Portable binary was not generated: bin/code-switch-R.exe'
          }
          Move-Item 'bin/code-switch-R.exe' 'bin/codeSwitchR.exe'

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          Push-Location bin
          Get-FileHash -Algorithm SHA256 'codeSwitchR.exe' |
            ForEach-Object { "$($_.Hash.ToLower())  codeSwitchR.exe" } |
            Out-File -Encoding ascii 'codeSwitchR.exe.sha256'
          Pop-Location

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-portable
          path: |
            bin/codeSwitchR.exe
            bin/codeSwitchR.exe.sha256

  create-release:
    name: Create Release
    needs: [build-windows-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64-portable
          path: release-assets

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate latest.json
        run: |
          python3 scripts/generate-latest-json.py "${GITHUB_REF_NAME}" release-assets release-assets/latest.json
          test -s release-assets/latest.json

      - name: Generate release body
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tr -d '\r' < RELEASE_NOTES.md | awk "/^# Code Switch v$VERSION/,/^# Code Switch v[0-9]/" | head -n -1 > /tmp/version_notes.md
          if [ ! -s /tmp/version_notes.md ]; then
            printf '## 更新亮点\n- 请查看提交历史了解详细更新\n' > /tmp/version_notes.md
          fi
          cp /tmp/version_notes.md /tmp/release_body.md
          cat >> /tmp/release_body.md <<'EOF'

          ---

          ## 下载说明

          | 平台 | 文件 | 说明 |
          |------|------|------|
          | **Windows amd64** | `codeSwitchR.exe` | 便携版，直接运行 |

          ## 文件校验

          ```powershell
          Get-FileHash codeSwitchR.exe -Algorithm SHA256
          ```
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
